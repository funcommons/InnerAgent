server:
  port: 18090
  servlet:
    context-path: /

spring:
  application:
    name: inneragent-server
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://${IA_DB_HOST:localhost}:${IA_DB_PORT:15432}/${IA_DB_NAME:inneragent}
    username: ${IA_DB_USER:inneragent}
    password: ${IA_DB_PASSWORD:inneragent}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${IA_REDIS_HOST:localhost}
      port: ${IA_REDIS_PORT:16379}
      password: ${IA_REDIS_PASSWORD:}
  cache:
    type: caffeine
  autoconfigure:
    exclude:
      # 模型接入由 ia_model_api_config 在运行期自管(密钥存库),不由 Spring AI
      # 自动装配提供;dashscope starter 的自动配置强制要求 spring.ai.dashscope.api-key
      # 且本项目无任何消费者,整体排除(P1 若接宿主桥再评估)。
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      # 实体 BaseEntity.deleted 为 Boolean @TableLogic,取值用 true/false
      logic-delete-value: true
      logic-not-delete-value: false

# 应用配置([adapt] 自融光 application.yaml app 段)
app:
  # Java 时区使用 IANA Zone ID
  time-zone: Asia/Shanghai
  agent-workspace:
    local-base-path: ${AGENT_WORKSPACE_LOCAL_PATH:./data/agent-workspace}
# P0 冒烟 mock 模型启用说明(无需任何开关):
#   ia_model_api_config.platform='mock' 且 text_protocol='mock' 即命中
#   MockAiProvider(V4__demo_seed.sql 已 seed 默认对话模型 mock-text)。
#   风险:mock 回复为脚本固定文案,演示部署可能被当真模型;生产环境严禁保留
#   platform='mock' 配置,详见 MockAiProvider 类注释。

# AgentScope 内核运行时(前缀与 AgentScopeV2Properties 注解一致;[adapt] 自融光
# fusion.agentscope.v2 段,state 表名换 ia_agent_state,确认超时按 PRD 决策 24h,
# onetoken 计费域未移植整段删除)
fusion:
  agentscope:
    v2:
      cache:
        maximum-size: 64
        expire-after-access: 30m
        capacity-wait: 5s
      state:
        mode: postgres
        table-name: "ia_agent_state"
      ingress:
        max-events: 4096
        max-bytes: 8388608
        coalesce-delay: 50ms
        coalesce-max-chars: 1024
      execution:
        owner-lease: 30s
        run-timeout: 30m
        confirmation-timeout: 24h
        max-iters: 999
      skills:
        enabled: true
        fail-fast: true
        display-names: {}
        repositories:
          bundled:
            location: classpath:agentscope/skills
            lazy: false
      mcp:
        enabled: ${AGENTSCOPE_MCP_ENABLED:false}
        fail-fast: true
        servers: {}

springdoc:
  api-docs:
    path: /ia/api-docs
  swagger-ui:
    path: /ia/swagger-ui.html

# MCP 宿主桥调用端(P1-T2b;McpClientToolInvoker 接管 McpToolInvoker 端口):
# 客户端按 (appId, endpointUrl) 懒建懒连——无可达宿主不阻断启动,按调用懒失败。
# 超时默认对齐 02-技术方案 §4.7;重连编排对应 spike 风险 R1(SDK 无自动重连,
# 会话失效后对同实例 re-initialize,单飞锁 + 指数退避;默认「重试一次」)。
# 请求体上限说明(R6):所钉 mcp 0.17.0 客户端传输不设请求体上限(无 413 路径),
# 故无大小旋钮;详见 McpInvokerProperties 类注释。
inneragent:
  mcp:
    # false 时 McpClientToolInvoker 不装配,回退 T2a 缺省 UnavailableMcpToolInvoker
    enabled: true
    # 单次 tools/call 超时(§4.7 默认 30s)
    call-timeout: 30s
    # 宿主客户端缓存容量(按 (appId, endpointUrl) 计,LRU 淘汰并关闭)
    max-clients: 32
    # 客户端空闲过期(注册变更走显式失效,不依赖过期)
    client-expire-after-access: 30m
    reconnect:
      # 首次重连前退避基数(指数:initial × 2^(attempt-1),封顶 max-backoff)
      initial-backoff: 200ms
      # 单次退避上限
      max-backoff: 5s
      # 单次 invoke 内「重连 + 重试」最多轮数;1 = 同实例 re-initialize 后重试一次
      max-attempts: 1

logging:
  level:
    com.inneragent: DEBUG

---
# 本地开发profile:连 docker/dev-compose.yml 起的 PG/Redis,允许匿名演示 Agent
spring:
  config:
    activate:
      on-profile: local
inneragent:
  security:
    allow-anonymous-demo: true
