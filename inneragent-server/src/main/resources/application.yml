server:
  port: 18090
  servlet:
    context-path: /

spring:
  application:
    name: inneragent-server
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://${IA_DB_HOST:localhost}:${IA_DB_PORT:15432}/${IA_DB_NAME:inneragent}
    username: ${IA_DB_USER:inneragent}
    password: ${IA_DB_PASSWORD:inneragent}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${IA_REDIS_HOST:localhost}
      port: ${IA_REDIS_PORT:16379}
      password: ${IA_REDIS_PASSWORD:}
  cache:
    type: caffeine

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /ia/api-docs
  swagger-ui:
    path: /ia/swagger-ui.html

logging:
  level:
    com.inneragent: DEBUG

---
# 本地开发profile:连 docker/dev-compose.yml 起的 PG/Redis,允许匿名演示 Agent
spring:
  config:
    activate:
      on-profile: local
inneragent:
  security:
    allow-anonymous-demo: true
